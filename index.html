 if(LS[2]){L[2]=L[3]=.02;const hp=P[2];for(const i of[3,4]){P[i].x=P[i].ox=hp.x;P[i].y=P[i].oy=hp.y}}
}
function cutLimb(k){
 const ar=k=='a'?LB.a:LB.l,c=[0,1].filter(i=>!ar[i]);if(!c.length)return;
 const i=c[Mh.random()*c.length|0];ar[i]=1;
 const p=k=='a'?P[1]:P[2],cl=v=>Mh.max(-8,Mh.min(8,v));
 GB.push({x:p.x,y:p.y,vx:(Mh.random()-.5)*6+cl((p.x-p.ox)/pdt*.3),vy:2+Mh.random()*3,a:Mh.random()*6.28,w:(Mh.random()-.5)*16,len:k=='a'?.6:.9,k,t:0,rest:0});
 blood(p.x,p.y,28,6);BD.push({k,t:7});
 if(LB.a[0]&&LB.a[1]&&P[0].pin)release();
 collapse();
 if(W.on&&!W.cr&&LB.l[0]&&LB.l[1])fall();
 if(W.cr&&LB.a[0]&&LB.a[1])fall();
}
function rlDie(){const c=P[2];blood(c.x,c.y,50,8);cutLimb('a');cutLimb('a');cutLimb('l');cutLimb('l');dead=1;burn=0;release();fall();toast('Ты погиб: «Сброс» вернёт на спавн')}
// урон от падения: резкое касание земли на большой скорости
const rlSoft=()=>(M.ob||[]).some(o=>(o[0]=='wt'||o[0]=='jl')&&P.some(p=>{const b=OB[o[0]](o),q=lp(o,p.x,p.y);return q[0]>b[0]-.3&&q[0]<b[2]+.3&&q[1]>b[1]-.3&&q[1]<b[3]+.3}));
function impactChk(dt){
 const h=P[2],vy=(h.y-h.oy)/pdt;

 const t=!P[0].pin&&P.some(p=>p.y<=flr(p.x,p.y)+.14);
 if(t&&!wasT){const v=dn;dn=0;if(v>11&&hurtT<=0&&!rlSoft())hurt(v)}
 wasT=t}
function hurt(v){
 hurtT=.6;const c=P[2];blood(c.x,c.y,Mh.min(40,v|0),4);
 if(v>=21){rlDie();return}
 const n=v>=16?1+(Mh.random()<.5?1:0):(Mh.random()<.6?1:0);

// оторванные конечности в 3D
function mkGib(q){
 const k3=SK3[S.skin]||SK3[0],g=new THREE.Group(),r=q.k=='a'?.05:.055,tint=m=>{if(chr>.01)m.color.lerp(new THREE.Color(0x1a1410),chr*.85);return m},
 m=tint(MT((q.k=='a'?k3[2]:k3[3])||'#888888'));
 const cy=new THREE.Mesh(CG,m);cy.scale.set(r,q.len,r);cy.rotation.z=Mh.PI/2;g.add(cy);
 const cap=new THREE.Mesh(SPH(),MT(0xa10c0c));cap.scale.setScalar(r*1.5);cap.position.x=-q.len/2;g.add(cap);
 let en;
 if(q.k=='a'){en=new THREE.Mesh(SPH(),tint(MT(0xe9e5d2)));en.scale.setScalar(.075);en.position.x=q.len/2}
 else{en=new THREE.Mesh(new THREE.BoxGeometry(.26,.045,.1),tint(MT(0xe9e5d2)));en.position.set(q.len/2+.04,-.06,0)}
 g.add(en);g.traverse(o=>{if(o.isMesh)o.castShadow=!!S.shd});sc3.add(g);return g}
function gibSync(){if(!sc3)return;for(const q of GB){if(!q.m)q.m=mkGib(q);q.m.position.set(q.x,q.y,0);q.m.rotation.z=q.a}}
function gibClear(){for(const q of GB)if(q.m){if(sc3)sc3.remove(q.m);q.m.traverse(o=>{if(o.material)o.material.dispose();if(o.geometry&&o.geometry!==CG)o.geometry.dispose()});q.m=0}}
// пилы режут конечности (по звеньям тела), торс — смерть; лава поджигает
function rlHaz(dt){
 sawT-=dt;hurtT-=dt;impactChk(dt);if(dead)return 0;let lava=0,hit=-1;
 for(const o of M.ob||[]){
  if(o[0]=='lv'){const b=OB.lv(o);if(P.some(p=>{const q=lp(o,p.x,p.y);return q[0]>b[0]&&q[0]<b[2]&&q[1]>b[1]&&q[1]<b[3]}))lava=1}
  else if(o[0]=='sw')for(let i=0;i<4;i++){if(LS[i])continue;const A=P[i],B=P[i+1];for(const t of[0,.25,.5,.75,1])if(Mh.hypot(A.x+(B.x-A.x)*t-o[1],A.y+(B.y-A.y)*t-o[2])<.72){if(hit<0||i==1)hit=i;break}}
 }
 if(lava&&burn<=0)burn=1.8;
 if(burn>0){if(inW)burn=0;else{burn-=dt;chr=Mh.min(1,chr+dt*.55);if(burn<=0){chr=1;dead=1;release();fall();toast('Ты сгорел: «Сброс» вернёт на спавн')}}}
 if(hit==1){rlDie();return 0}
 if(hit>=0&&sawT<=0){sawT=.4;cutLimb(hit?'l':'a')}
 return 0}
function goreStep(dt){
 if(mode!='play')return;
 const g=GV[S.grav];
 if(burn>0&&!RL())burn=0;
 if(burn>0)for(let k=0;k<2;k++)if(Mh.random()<dt*60){const p=P[Mh.random()*5|0];fire(p.x+(Mh.random()-.5)*.2,p.y+(Mh.random()-.5)*.2)}
 for(let i=BL.length;i--;){const b=BL[i];b.t+=dt;if(b.t>b.life){BL.splice(i,1);continue}
  if(b.f){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=1-1.5*dt;continue}
  if(!b.st){b.vy-=g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;const fl=flr(b.x,b.y+.2)+.02;if(b.y<=fl&&b.y>(M.gy||0)-1){b.y=fl;b.st=1;b.vx=b.vy=0}}}
 for(const q of GB){q.t+=dt;if(q.rest)continue;q.vy-=g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.a+=q.w*dt;
  const fl=flr(q.x,q.y+.2)+.07;
  if(q.y<fl&&q.y>(M.gy||0)-1){q.y=fl;if(Mh.abs(q.vy)>1.2){q.vy*=-.3;q.vx*=.6;q.w*=.6;blood(q.x,q.y,3,2)}else{q.vy=0;q.vx*=.85;q.w*=.8;if(Mh.abs(q.vx)<.05&&Mh.abs(q.w)<.1)q.rest=1}}
  if(q.y<-80)q.rest=1;
  if(q.t<1.5&&Mh.random()<dt*18)blood(q.x,q.y,1,1.2)}
 for(let i=BD.length;i--;){const b=BD[i];b.t-=dt;if(b.t<=0){BD.splice(i,1);continue}const p=b.k=='a'?P[1]:P[2];if(Mh.random()<dt*16)blood(p.x,p.y,1,1.5)}
}
function goreDraw(g,pr){
 const K=SK[S.skin]||SK[0],vz=(x,y)=>!R3||v3(x,y,0).project(cam3).z<1,mx=cv.height*.04,
 sx=(x,y)=>{const a=pr(x,y),b=pr(x+1,y);return Mh.min(Mh.hypot(b[0]-a[0],b[1]-a[1])||1,cv.height*.25)};
 g.save();g.lineCap='round';
 if(!R3)for(const q of GB){const sc=sx(q.x,q.y),dx=Mh.cos(q.a)*q.len/2,dy=Mh.sin(q.a)*q.len/2,A=pr(q.x-dx,q.y-dy),B=pr(q.x+dx,q.y+dy);
  g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.strokeStyle=K[1];g.lineWidth=.2*sc;g.stroke();g.strokeStyle=K[0];g.lineWidth=.15*sc;g.stroke();
  g.fillStyle='#a10c0c';g.beginPath();g.arc(A[0],A[1],.085*sc,0,7);g.fill();
  if(q.k=='a'){g.fillStyle='#e9e5d2';g.beginPath();g.arc(B[0],B[1],.085*sc,0,7);g.fill()}}
 for(const b of BD){const p=b.k=='a'?P[1]:P[2];if(!vz(p.x,p.y))continue;const c=pr(p.x,p.y),sc=sx(p.x,p.y);g.fillStyle='#b00e0e';g.beginPath();g.arc(c[0],c[1],Mh.min(mx,.075*sc),0,7);g.fill()}
 for(const b of BL){if(!vz(b.x,b.y))continue;const p=pr(b.x,b.y),r=Mh.min(mx,Mh.max(1.5,b.r*sx(b.x,b.y)));
  if(b.f){const t=b.t/b.life;g.fillStyle='rgba(255,'+((210-180*t)|0)+',25,'+(.85*(1-t))+')';g.beginPath();g.arc(p[0],p[1],r*(1.1-.5*t),0,7);g.fill();continue}
  const a=Mh.min(1,(b.life-b.t)/2);g.fillStyle='rgba('+(b.st?125:175)+',8,10,'+a+')';g.beginPath();if(b.st)g.ellipse(p[0],p[1],r*1.8,r*.6,0,0,7);else g.arc(p[0],p[1],r,0,7);g.fill()}
 g.restore()}

function startCrawl(gl){const hp=P[2];SU.want=0;rag=0;CRW=0;Object.assign(W,{on:1,cr:1,x:hp.x,y:gl,vx:0,vy:0,l:0,lv:0,ph:0,jp:0});W.fd=P[1].x>=P[2].x?1:-1;W.cf=W.fd;cd=.5;hudUp()}
function crawlStep(dt){
 const d=(held.r?1:0)-(held.l?1:0);if(d)W.fd=d;
 W.cf=(W.cf==null?W.fd:W.cf);W.cf+=(W.fd-W.cf)*Mh.min(1,10*dt);const cf=W.cf;
 tm+=dt;mv();W.jp=0;
 W.vx+=(d*.9-W.vx)*Mh.min(1,6*dt);W.x+=W.vx*dt;
 for(const b of BXs())if(W.y<b[3]-.05&&W.x>b[0]-.3&&W.x<b[2]+.3){W.x=W.x<(b[0]+b[2])/2?b[0]-.3:b[2]+.3;W.vx=0}
 W.y=flr(W.x,W.y);W.ph+=Mh.abs(W.vx)*dt*5;
 const f=W.y,fd=W.fd,hp=[W.x,f+.1],sh=[W.x+cf*.46,f+.22+(1-Mh.abs(cf))*.3],N=[0,sh,hp,hp,hp],mv2=Mh.min(1,Mh.abs(W.vx)*1.2);
 DA.a=fd*1.1;DA.sw=Mh.sin(W.ph)*.55*mv2;
 for(let i=1;i<5;i++){const p=P[i],n=N[i];p.x=p.ox=n[0];p.y=p.oy=n[1];p.pin=false}
 pdt=dt;
 const e=armEnd(0),h=P[0];h.x=h.ox=e[0];h.y=h.oy=e[1];h.pin=false
}
